[workspace]
members = [
    "crates/core",
    "crates/types",
    "crates/storage",
    "crates/network",
    "crates/consensus",
    "crates/ledger",
    "crates/assets",
    "crates/debt-ledger",
    "crates/lending",
    "crates/liquidation",
    "crates/bridge",
    "crates/vm",
    "crates/node",
    "crates/rpc",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Pasion Team"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tokio = { version = "1.35", features = ["full"] }
hex = "0.4"
sha2 = "0.10"
blake3 = "1.5"
rand = "0.8"
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
bincode = "1.3"
rocksdb = { version = "0.21", features = ["lz4"] }
async-trait = "0.1"
clap = { version = "4.4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
dashmap = "5.5"
futures = "0.3"
libp2p = { version = "0.53", features = ["tcp", "noise", "yamux", "gossipsub", "mdns", "kad"] }

# OpenVM dependencies
openvm = { git = "https://github.com/openvm-org/openvm.git", rev = "59a69b8" }
openvm-sdk = { git = "https://github.com/openvm-org/openvm.git", rev = "59a69b8" }
